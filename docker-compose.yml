services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: upnms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: upnms
    # No "ports:" — only the backend (same Docker network) needs to reach
    # Postgres. Publishing 5432 to the VM's public IP would let anyone on
    # the network attempt to connect directly to the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upnms"]
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: upnms
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: upnms
      DOCKER_INFLUXDB_INIT_BUCKET: device_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    # No "ports:" — only the backend needs to reach InfluxDB, same reasoning
    # as postgres above.
    volumes:
      - influx-data:/var/lib/influxdb2

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000" # API — must stay published: device-image <img> tags in
                     # every user's browser load directly from this port,
                     # not just from the backend container.
      # 9001 (admin console) intentionally NOT published — manage MinIO via
      # `docker compose exec minio ...` or a temporary SSH tunnel instead of
      # exposing the admin UI on the public network.
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      DATABASE_URL: postgresql://upnms:${POSTGRES_PASSWORD}@postgres:5432/upnms
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: upnms
      INFLUX_BUCKET: device_metrics
      # Split into two values — see configuration.ts for why one shared
      # value doesn't work: the backend container needs to reach MinIO via
      # the Docker service name, while browsers loading device-image <img>
      # tags need a host they can actually resolve.
      MINIO_ENDPOINT: minio               # internal — backend container -> MinIO container
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT} # external — browser -> published port 9000
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: device-images
      SNMP_PROVIDER: ${SNMP_PROVIDER:-mock}
      SNMP_COMMUNITY: public
      SNMP_POLL_INTERVAL_MS: 300000
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "3001:3001"
    # First run only: apply migrations + create the admin login (no sample
    # zones/devices — add real ones through the UI). `docker compose exec
    # backend sh` then run:
    #   npx prisma migrate deploy && npm run db:seed

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  influx-data:
  minio-data:
